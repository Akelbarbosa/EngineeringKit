name: Swift compatibility

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Swift ${{ matrix.swift }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: '6.0.0'
            image: swift:6.0.0-jammy@sha256:52a19279ed4b545c7b3bb517a4dc688953151e68e040c638aef5f047cd8b51db
          - swift: '6.3.3'
            image: swift:6.3.3-jammy@sha256:2f3a1d7bb74da95c4857514589667a58087fdaf34f11e424d47854bebd710cf2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift run EngineeringKitDemo
      - run: swift run --package-path Examples/PackageConsumer PackageConsumer

  apple:
    name: Apple / Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '16.0'
          - os: macos-26
            xcode: '26.6'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift run EngineeringKitDemo
      - run: swift run --package-path Examples/PackageConsumer PackageConsumer
      - run: bash scripts/check-apple.sh
